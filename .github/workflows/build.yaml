name: Build
on:
  workflow_dispatch:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4.0.0
      - name: Install .NET 9
        uses: actions/setup-dotnet@v4.0.0
        with:
          dotnet-version: 9.0.x
      - name: Restore packages
        run: dotnet restore
      - name: Build project
        run: dotnet build --no-restore
